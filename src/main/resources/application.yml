spring:
  application:
    name: web-bff
  autoconfigure:
    exclude: org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

server:
  port: 8110

sdui:
  service:
    name: web-bff
  security:
    internal-secret: ${SDUI_INTERNAL_SECRET:dev-only-internal-secret-change-me-0123456789}
    protected-paths: /internal/**
  bff:
    cookie: sdui_web_sess
    secure-cookie: false
    idle: PT10M
    absolute: PT8H
    origins: http://localhost:5180,http://localhost:5181
  upstream:
    delivery-service: ${SDUI_DELIVERY_SERVICE:http://localhost:8100/api}
